# BACKUP COPY - Active config at: ~/.config/sr3/subscribe/marine_forecast.conf
#
broker amqps://dd.weather.gc.ca
topicPrefix v02.post

directory /home/keelando/envcan_wave/data/marine_forecast
logDir /home/keelando/envcan_wave/logs

instances 1
batch 50
logLevel info

# Marine weather forecasts for Strait of Georgia
# m0000028 covers BOTH north and south of Nanaimo zones
# Updated for new date-based directory structure: /YYYYMMDD/WXO-DD/marine_weather/pacific/HH/
subtopic *.WXO-DD.marine_weather.pacific.#
