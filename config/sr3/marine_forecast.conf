# SOURCE OF TRUTH — edit here, then deploy:
#   cp config/sr3/marine_forecast.conf ~/.config/sr3/subscribe/
#   sr3 restart subscribe/marine_forecast
#
broker amqps://dd.weather.gc.ca
topicPrefix v02.post

directory /home/keelando/envcan_wave/data/marine_forecast

instances 1
batch 50
logLevel info

# Marine weather forecasts for the Georgia Basin (6 bulletins / 9 zones)
# Updated for new date-based directory structure: /YYYYMMDD/WXO-DD/marine_weather/pacific/HH/
subtopic *.WXO-DD.marine_weather.pacific.#

# Only download English, and only the Georgia Basin bulletins we render.
# A bulletin is not a zone: one file can carry several forecast zones
# (m0000028 = both Strait of Georgia zones, m0000009 = all three Juan de Fuca
# sub-zones). Codes come from MSC's published region list — see
# docs/MSC_REFERENCE_TABLES.md. Adding a zone needs no parser or UI edit,
# only a line here.
accept .*m0000028_en\.xml.*
accept .*m0000009_en\.xml.*
accept .*m0000064_en\.xml.*
accept .*m0000102_en\.xml.*
accept .*m0000010_en\.xml.*
accept .*m0000065_en\.xml.*
reject .*
