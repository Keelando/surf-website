# BACKUP COPY - Active config at: ~/.config/sr3/subscribe/bc_wind_stations.conf
#
# Environment Canada coastal weather stations for wind monitoring
# Data source: https://dd.weather.gc.ca/observations/swob-ml/
#
broker amqps://dd.weather.gc.ca
topicPrefix v02.post

directory /home/keelando/envcan_wave/data/wind
logDir /home/keelando/envcan_wave/logs

instances 1
batch 50
logLevel info

# Sisters Islets - CWGT (Strait of Georgia)
subtopic *.WXO-DD.observations.swob-ml.*.CWGT.#

# Ballenas - CWGB (Strait of Georgia)
subtopic *.WXO-DD.observations.swob-ml.*.CWGB.#

# Entrance Island - CWEL (Nanaimo area)
subtopic *.WXO-DD.observations.swob-ml.*.CWEL.#

# Point Atkinson - CWSB (West Vancouver)
subtopic *.WXO-DD.observations.swob-ml.*.CWSB.#

# Tsawwassen - CVTF (Delta)
subtopic *.WXO-DD.observations.swob-ml.*.CVTF.#

# Sand Heads - CWVF (Fraser River mouth)
subtopic *.WXO-DD.observations.swob-ml.*.CWVF.#

# Saturna - CWEZ (Gulf Islands)
subtopic *.WXO-DD.observations.swob-ml.*.CWEZ.#

# Race Rocks - CWQK (Juan de Fuca Strait)
subtopic *.WXO-DD.observations.swob-ml.*.CWQK.#

# YVR Airport - CYVR (Richmond) - Note: Uses MAN (manual) observations
subtopic *.WXO-DD.observations.swob-ml.*.CYVR.#

# Boundary Bay Airport - CZBB (Delta)
subtopic *.WXO-DD.observations.swob-ml.*.CZBB.#

# CPJM - Test station (minute updates) - TEMPORARY
subtopic *.WXO-DD.observations.swob-ml.*.CPJM.#
