# SOURCE OF TRUTH — edit here, then deploy:
#   cp config/sr3/bc_lightstation_obs.conf ~/.config/sr3/subscribe/
#   sudo systemctl restart sr3-bc-lightstation-obs
#
# BC Lightstation observations — two bulletin families:
#
# SXCN (hourly, compact format with extra fields: visibility, cloud, pressure, sea temp)
#   SXCN23 = North Coast / Hecate (Green, Triple, Bonilla, Langara, Boat Bluff, etc.)
#   SXCN24 = Central Coast / N. Island (Chatham, Scarlett, Pine, Egg, Cape Scott, Quatsino)
#   SXCN25 = WCVI South / Tofino area (Nootka, Estevan, Lennard, Cape Beale)
#   SXCN26 = Georgia Strait / S. Coast (Chrome, Merry, Entrance, Trial Island)
#   SXCN50 = All BC buoys summary (17 buoys — future use)
#
# FPCN61 (every ~3 hours, detailed text format — our original lightstation source)
#   All 19 lightstations including Cape Mudge & Pulteney Point (not in any SXCN)
#
# Skip SXCN24 — all its stations are already in FPCN61.
#
broker amqps://dd.weather.gc.ca
topicPrefix v02.post

directory /home/keelando/envcan_wave/data/lightstation_bulletins

instances 1
batch 50
logLevel info

subtopic *.WXO-DD.bulletins.alphanumeric.*.SX.CWVR.#
subtopic *.WXO-DD.bulletins.alphanumeric.*.FP.CWVR.#

# SXCN lightstation obs (skip SXCN24 — redundant with FPCN61)
accept .*SXCN23.*
accept .*SXCN25.*
accept .*SXCN26.*

# All-BC buoy summary (not parsed yet, but collect for future use)
accept .*SXCN50.*

# FPCN61 — original lightstation report (Cape Mudge & Pulteney only source)
accept .*FPCN61.*

reject .*
