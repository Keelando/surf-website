# SOURCE OF TRUTH — edit here, then deploy:
#   cp config/sr3/bc_lightstation_obs.conf ~/.config/sr3/subscribe/
#   sr3 restart subscribe/bc_lightstation_obs
#
# BC Lightstation marine observations (FICN bulletins from CWVR)
# These complement the FPCN61 bulletin (fetched separately via cron/HTTP).
#
# FICN31 = North & Central Coast (Langara, Bonilla, McInnes, Cape Scott, etc.)
# FICN32 = Georgia Strait / South Coast (Chrome Island, Merry Island, Trial Island, etc.)
# FICN33 = WCVI South (Lennard Island, Estevan Point, Cape Beale)
#
broker amqps://dd.weather.gc.ca
topicPrefix v02.post

directory /home/keelando/envcan_wave/data/lightstation_ficn
logDir /home/keelando/envcan_wave/logs

instances 1
batch 50
logLevel info

subtopic *.WXO-DD.bulletins.alphanumeric.*.FI.CWVR.#
