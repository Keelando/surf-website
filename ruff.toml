line-length = 120
target-version = "py310"
src = ["."]

extend-exclude = [
  "archive",
  "assets",
  "data",
  "docs",
  "logs",
  "migrations",
  "site",
  "__pycache__"
]

[lint]
select = ["E", "F", "I"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
